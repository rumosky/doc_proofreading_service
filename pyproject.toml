[project]
name = "doc-proofreading-service"
version = "0.1.0"
description = "A Flask service for document proofreading"
readme = "README.md"
requires-python = ">=3.12,<3.15"
authors = [
    {name = "rumosky", email = "rumosky@163.com"}
]
# 核心依赖
dependencies = [
    "flask>=3.1.2,<4.0.0",
    "flask-cors>=6.0.1,<7.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "openai>=1.0.0",
    "gevent>=25.9.1,<26.0.0",
    "gunicorn>=23.0.0,<24.0.0",
    "waitress>=3.0.2,<4.0.0",
    "requests>=2.32.5,<3.0.0",
    "cozepy>=0.20.0",
]

[dependency-groups]
# 开发环境依赖（uv 用法）
dev = [
    "pyinstaller>=6.16.0,<7.0.0",
]

[tool.uv]
# 关键设置：告诉 uv 这是一个应用，不需要构建安装包
package = false

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple"
default = true

[build-system]
# 使用标准的 hatchling 后端，不再依赖 poetry-core
requires = ["hatchling"]
build-backend = "hatchling.build"
