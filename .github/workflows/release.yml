name: Release
on:
  push:
    branches:
      - app # 当推送到 app 分支时触发

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest' # 目前您的主要目标平台

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: install dependencies
        run: pnpm install

      # --- 关键步骤：恢复敏感文件并注入环境变量 ---
      - name: Restore Secrets
        shell: bash
        run: |
          # 恢复 .env 文件
          echo "${{ secrets.ENV_FILE }}" > .env
          
          # 恢复 PEM 私钥文件
          echo "${{ secrets.PEM_FILE }}" > coze_private_key.pem
          
          # 将 .env 中的变量导出到 GITHUB_ENV，以便 Rust 编译器在打包时注入
          while IFS='=' read -r key value; do
            # 忽略注释和空行
            if [[ ! $key =~ ^# && -n $key ]]; then
              # 去除两侧引号（如果有）
              value=$(echo $value | sed -e 's/^"//' -e 's/"$//')
              echo "$key=$value" >> $GITHUB_ENV
            fi
          done < .env
          
          # 将 PEM 内容作为环境变量导出，用于 compile-time 注入
          echo "COZE_PRIVATE_KEY_CONTENT<<EOF" >> $GITHUB_ENV
          cat coze_private_key.pem >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__ # 使用 tauri.conf.json 中的版本号
          releaseName: "文档校对助手 v__VERSION__"
          releaseBody: "自动生成的 Release"
          releaseDraft: true
          prerelease: false
          args: --target x86_64-pc-windows-msvc
